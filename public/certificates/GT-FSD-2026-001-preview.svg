  <text x="600" y="330" font-family="'Times New Roman', Times, serif" font-size="52" font-weight="bold" fill="#0F172A" text-anchor="middle" letter-spacing="1">Hardik Bindal</text>
  <line x1="320" y1="355" x2="880" y2="355" stroke="#CBD5E1" stroke-width="1.5"/>

