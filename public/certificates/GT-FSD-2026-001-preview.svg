  <text x="600" y="132" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="2">GOVT. APPROVED ENTERPRISE TELECOM &amp; DIGITAL INFRASTRUCTURE • NEW DELHI</text>
  
  <line x1="450" y1="150" x2="750" y2="150" stroke="#D4AF37" stroke-width="2"/>
