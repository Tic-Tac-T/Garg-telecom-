  <rect x="32" y="32" width="1136" height="786" rx="2" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <rect x="40" y="40" width="1120" height="770" fill="none" stroke="#93C5FD" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Corner Ornaments -->
  <path d="M 45 65 L 45 45 L 65 45" stroke="#D4AF37" stroke-width="3" fill="none"/>
  <path d="M 1155 65 L 1155 45 L 1135 45" stroke="#D4AF37" stroke-width="3" fill="none"/>
  <path d="M 45 785 L 45 805 L 65 805" stroke="#D4AF37" stroke-width="3" fill="none"/>
  <path d="M 1155 785 L 1155 805 L 1135 805" stroke="#D4AF37" stroke-width="3" fill="none"/>

