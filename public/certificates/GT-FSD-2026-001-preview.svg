  <text x="600" y="475" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#1E293B" text-anchor="middle">Full Stack Web Development</text>
  
  <text x="600" y="525" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    demonstrating exceptional technical competence in modern full-stack web engineering, system architecture,
  </text>
