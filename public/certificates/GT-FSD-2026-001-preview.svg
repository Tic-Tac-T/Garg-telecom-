  <text x="600" y="210" font-family="'Times New Roman', Times, serif" font-size="38" font-weight="bold" fill="#1E3A8A" text-anchor="middle" letter-spacing="3">CERTIFICATE OF COMPLETION</text>
  
  <!-- Subtitle -->
  <text x="600" y="260" font-family="'Times New Roman', Times, serif" font-size="16" font-style="italic" fill="#475569" text-anchor="middle">This is proudly presented to</text>

